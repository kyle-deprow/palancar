      model: os.environ/PALANCAR_LITELLM_UPSTREAM_MODEL
      api_key: os.environ/OPENROUTER_API_KEY
      max_retries: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  num_retries: 0
  fallbacks: []
  context_window_fallbacks: []

router_settings:
  num_retries: 0
  fallbacks: []
  context_window_fallbacks: []
